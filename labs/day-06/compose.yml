name: wazuh-day06
services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      POSTGRES_DB: case_ef_learning
    ports:
      - "127.0.0.1:15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d case_ef_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: